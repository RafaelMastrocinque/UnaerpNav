<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>UNAERP Navigator</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --unaerp-blue: #001B3D; --unaerp-accent: #0047AB; --unaerp-yellow: #FFC107; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body, html { height: 100%; width: 100%; overflow: hidden; background-color: #F4F6F9; }
        
        #app { width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; }
        
        .screen { display: none; flex: 1; flex-direction: column; overflow-y: auto; padding-bottom: 70px; }
        .screen.active { display: flex; }

        /* Cabeçalho Mobile */
        .header { background-color: var(--unaerp-blue); color: white; padding: 20px 15px; text-align: center; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; flex-shrink: 0; }
        .header h1 { font-size: 22px; font-style: italic; font-weight: 800; }
        .header p { font-size: 11px; margin-top: 5px; opacity: 0.8; }

        /* Tela Inicial */
        .search-bar { margin: 15px; position: relative; }
        .search-bar input { width: 100%; padding: 15px 15px 15px 40px; border: none; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); font-size: 14px; }
        .search-bar i { position: absolute; left: 15px; top: 15px; color: #888; }

        .grid-categories { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 15px; }
        .cat-btn { background: white; border: none; padding: 15px 5px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer; }
        .cat-btn:active { background: #e6e6e6; }
        .cat-btn i { font-size: 20px; color: var(--unaerp-accent); margin-bottom: 8px; }
        .cat-btn span { font-size: 10px; font-weight: 600; color: #333; }

        .btn-location { background-color: var(--unaerp-accent); color: white; border: none; margin: 20px 15px; padding: 15px; border-radius: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; }
        
        /* Mapas */
        .map-container { flex: 1; position: relative; display: flex; flex-direction: column; }
        .map-view { flex: 1; width: 100%; height: 100%; background: #e5e5e5; z-index: 1; }
        
        /* Lista de Destinos */
        .list-item { background: white; margin: 10px 15px; padding: 15px; border-radius: 10px; display: flex; align-items: center; gap: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer; }
        .list-item i { font-size: 24px; color: var(--unaerp-accent); width: 30px; text-align: center; }
        .list-item div { flex: 1; }
        .list-item h4 { font-size: 16px; color: #333; }
        .list-item p { font-size: 12px; color: #777; }

        /* Navegação */
        .nav-banner-top { position: absolute; top: 10px; left: 10px; right: 10px; background: var(--unaerp-blue); color: white; padding: 15px; border-radius: 10px; z-index: 1000; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .nav-banner-bottom { position: absolute; bottom: 20px; left: 10px; right: 10px; background: white; padding: 15px; border-radius: 10px; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 15px; }
        .nav-arrow { font-size: 30px; color: var(--unaerp-accent); }
        
        /* Bússola */
        .compass-container { flex: 1; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; position: relative; }
        .compass-circle { width: 250px; height: 250px; border: 2px solid #333; border-radius: 50%; position: relative; display: flex; align-items: center; justify-content: center; }
        .compass-arrow { font-size: 60px; color: var(--unaerp-yellow); transition: transform 0.1s linear; }
        .compass-distance { font-size: 48px; font-weight: bold; margin-bottom: 10px; }
        .compass-label { font-size: 18px; color: #aaa; margin-bottom: 40px; }

        /* Barra Inferior Fixa */
        .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; height: 60px; background: white; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #ddd; z-index: 2000; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #888; font-size: 10px; cursor: pointer; }
        .nav-item.active { color: var(--unaerp-accent); }
        .nav-item i { font-size: 20px; margin-bottom: 3px; }

        .btn-back { position: absolute; top: 20px; left: 20px; background: white; border: none; width: 40px; height: 40px; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 1001; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .leaflet-control-attribution { display: none; } /* Esconder créditos do Leaflet para limpar o visual */
    </style>
</head>
<body>

<div id="app">
    <!-- TELA 1: HOME -->
    <div id="screen-home" class="screen active">
        <div class="header">
            <h1>UNAERP NAVIGATOR</h1>
            <p>Encontre o seu destino no campus com facilidade.</p>
        </div>
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Buscar um local..." id="search-input">
        </div>
        <div class="grid-categories">
            <button class="cat-btn" onclick="filterCategory('Blocos')"><i class="fas fa-building"></i><span>Blocos</span></button>
            <button class="cat-btn" onclick="filterCategory('Biblioteca')"><i class="fas fa-book"></i><span>Biblioteca</span></button>
            <button class="cat-btn" onclick="filterCategory('Salas de Aula')"><i class="fas fa-graduation-cap"></i><span>Salas de Aula</span></button>
            <button class="cat-btn" onclick="filterCategory('Restaurante')"><i class="fas fa-utensils"></i><span>Restaurante</span></button>
            <button class="cat-btn" onclick="filterCategory('Hospital')"><i class="fas fa-hospital"></i><span>Hospital</span></button>
            <button class="cat-btn" onclick="filterCategory('Quadras')"><i class="fas fa-futbol"></i><span>Quadras</span></button>
        </div>
        <button class="btn-location" onclick="startTracking()">
            <i class="fas fa-location-arrow"></i> Usar minha localização
        </button>
    </div>

    <!-- TELA 2: SELEÇÃO DE DESTINO -->
    <div id="screen-select" class="screen">
        <div class="header" style="padding: 15px; border-radius: 0; display: flex; align-items: center;">
            <i class="fas fa-chevron-left" onclick="switchScreen('screen-home')" style="cursor: pointer; margin-right: 15px; font-size: 18px;"></i>
            <h2 style="font-size: 16px;">Selecionar destino</h2>
        </div>
        <div id="destination-list" style="padding-bottom: 20px;"></div>
    </div>

    <!-- TELA 3: NAVEGAÇÃO NO MAPA -->
    <div id="screen-nav" class="screen">
        <div class="map-container">
            <div id="map-nav" class="map-view"></div>
            <button class="btn-back" onclick="switchScreen('screen-home')"><i class="fas fa-times"></i></button>
            <div class="nav-banner-top">
                <div>
                    <h3 style="font-size: 14px;" id="nav-instruction">Siga em frente</h3>
                    <p style="font-size: 11px; opacity: 0.8;" id="nav-distance">Calculando...</p>
                </div>
                <div style="text-align: right;">
                    <h4 style="font-size: 14px;" id="nav-time">-- min</h4>
                </div>
            </div>
            <div class="nav-banner-bottom">
                <i class="fas fa-arrow-right nav-arrow" id="nav-arrow-icon"></i>
                <div>
                    <h4 style="font-size: 14px; color: #333;" id="nav-action">Vire à direita</h4>
                    <p style="font-size: 11px; color: #777;" id="nav-action-dist">100 m</p>
                </div>
            </div>
        </div>
    </div>

    <!-- TELA 4: BÚSSOLA -->
    <div id="screen-compass" class="screen">
        <div class="compass-container">
            <button class="btn-back" style="background: #333; color: white;" onclick="switchScreen('screen-nav')"><i class="fas fa-arrow-left"></i></button>
            <h2 style="margin-bottom: 20px; font-size: 18px;" id="compass-dest-name">Destino</h2>
            <div class="compass-distance" id="compass-distance">0 m</div>
            <div class="compass-label">à sua frente</div>
            <div class="compass-circle">
                <i class="fas fa-location-arrow compass-arrow" id="compass-arrow"></i>
            </div>
        </div>
    </div>

    <!-- NAVEGAÇÃO INFERIOR -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchScreen('screen-home')"><i class="fas fa-home"></i><span>Início</span></div>
        <div class="nav-item" onclick="switchScreen('screen-nav')"><i class="fas fa-map"></i><span>Mapa</span></div>
        <div class="nav-item" onclick="switchScreen('screen-compass')"><i class="fas fa-compass"></i><span>Bússola</span></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // --- 1. PONTOS BASEADOS NA IMAGEM DO MAPA (Coordenadas X, Y em pixels) ---
    // A imagem do mapa tem cerca de 1000x600 pixels. 
    // Ajustei os pontos para baterem com a posição visual na foto.
    const campusData = [
        { id: 1, name: "Bloco A - Reitoria", cat: "Blocos", x: 250, y: 200, desc: "Reitoria" },
        { id: 2, name: "Bloco B - Multiatendimento", cat: "Blocos", x: 300, y: 250, desc: "Financeiro" },
        { id: 13, name: "Biblioteca (Bloco E)", cat: "Biblioteca", x: 450, y: 300, desc: "1º andar" },
        { id: 25, name: "Restaurante Universitário", cat: "Restaurante", x: 750, y: 500, desc: "Bloco L" },
        { id: 27, name: "Hospital Electro Bonini", cat: "Hospital", x: 850, y: 400, desc: "Bloco N" },
        { id: 22, name: "Quadras Poliesportivas", cat: "Quadras", x: 650, y: 150, desc: "Esportes" },
        { id: 12, name: "Academia de Ginástica", cat: "Academia", x: 550, y: 450, desc: "Geraldo Barreto" },
        { id: 14, name: "Bloco F - Teatro", cat: "Blocos", x: 500, y: 400, desc: "Teatro" },
    ];

    // --- 2. VARIÁVEIS ---
    let mapNav, mapFull;
    let userX = 150, userY = 450; // Posição inicial simulada (Portico)
    let userMarker = null;
    let destX = null, destY = null;
    let routeLine = null;
    let isTracking = false;

    // --- 3. INICIALIZAÇÃO DO MAPA COM IMAGEM ---
    function initMaps() {
        // Define os limites da imagem (0,0 é o topo esquerdo, 1000,600 é o fundo direito)
        const bounds = [[0, 0], [600, 1000]];

        // Inicializa o mapa usando CRS.Simple (ideal para mapas de imagem)
        mapNav = L.map('map-nav', {
            crs: L.CRS.Simple,
            minZoom: -1,
            maxZoom: 2,
            zoomControl: false
        }).fitBounds(bounds);

        // Adiciona a imagem do mapa como fundo
        // IMPORTANTE: O arquivo 'mapa.png' deve estar na mesma pasta do index.html no GitHub
        L.imageOverlay('mapa.png', bounds).addTo(mapNav);

        // Adiciona os pinos dos blocos
        campusData.forEach(loc => {
            L.marker([loc.y, loc.x]).addTo(mapNav).bindPopup(`<b>${loc.name}</b><br>${loc.desc}`);
        });

        // Cria o marcador do usuário (ponto azul)
        userMarker = L.circleMarker([userY, userX], {
            color: '#0047AB', fillColor: '#0047AB', fillOpacity: 1, radius: 8
        }).addTo(mapNav).bindPopup("Você está aqui");
    }

    // --- 4. CONTROLE DE TELAS ---
    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        if(screenId === 'screen-home') document.querySelectorAll('.nav-item')[0].classList.add('active');
        if(screenId === 'screen-nav') document.querySelectorAll('.nav-item')[1].classList.add('active');
        if(screenId === 'screen-compass') document.querySelectorAll('.nav-item')[2].classList.add('active');

        setTimeout(() => {
            if(mapNav) mapNav.invalidateSize();
        }, 200);
    }

    // --- 5. SIMULAÇÃO DE GPS (Já que é um mapa de imagem) ---
    // Como o mapa é uma foto, o GPS real do celular não sabe onde fica a Biblioteca na foto.
    // Este botão simula o usuário andando pelo mapa para você testar as rotas.
    function startTracking() {
        const btn = document.querySelector('.btn-location');
        btn.innerHTML = '<i class="fas fa-check"></i> Localização Ativa (Simulada)';
        isTracking = true;
        alert("Como o mapa é uma imagem personalizada, o GPS real não funciona. Uma localização simulada foi ativada para testes. Clique em um destino para ver a rota!");
    }

    // --- 6. LÓGICA DE ROTA ---
    function filterCategory(cat) {
        switchScreen('screen-select');
        const list = document.getElementById('destination-list');
        list.innerHTML = '';
        
        const filtered = campusData.filter(loc => loc.cat === cat);
        
        filtered.forEach(loc => {
            const div = document.createElement('div');
            div.className = 'list-item';
            div.innerHTML = `
                <i class="fas fa-map-marker-alt"></i>
                <div><h4>${loc.name}</h4><p>${loc.desc}</p></div>
                <i class="fas fa-chevron-right" style="color:#ccc; font-size:14px;"></i>
            `;
            div.onclick = () => selectDestination(loc);
            list.appendChild(div);
        });
    }

    function selectDestination(loc) {
        destX = loc.x;
        destY = loc.y;
        document.getElementById('compass-dest-name').innerText = loc.name;
        
        switchScreen('screen-nav');
        
        if (routeLine) mapNav.removeLayer(routeLine);
        L.marker([destY, destX]).addTo(mapNav).bindPopup(loc.name).openPopup();
        
        updateRoute();
    }

    function updateRoute() {
        if (!destX || !destY) return;

        // Desenha a linha da rota
        if (routeLine) mapNav.removeLayer(routeLine);
        routeLine = L.polyline([[userY, userX], [destY, destX]], {color: '#0047AB', weight: 5}).addTo(mapNav);
        mapNav.fitBounds(routeLine.getBounds(), {padding: [50, 50]});

        // Calcula a distância na imagem (Teorema de Pitágoras)
        const dx = destX - userX;
        const dy = destY - userY;
        const distancePixels = Math.sqrt(dx*dx + dy*dy);
        
        // Converte pixels para metros (considerando que 10 pixels = 1 metro na imagem)
        const distanceMeters = Math.round(distancePixels / 10);
        const tempoMin = Math.ceil(distanceMeters / 80); // 80 metros por minuto

        // Atualiza a interface
        document.getElementById('nav-distance').innerText = `Siga em frente ${distanceMeters} m`;
        document.getElementById('nav-time').innerText = `${tempoMin} min`;
        document.getElementById('nav-action-dist').innerText = `${distanceMeters} m`;
        document.getElementById('compass-distance').innerText = `${distanceMeters} m`;
        
        // Calcula o ângulo para a bússola
        const angle = Math.atan2(dy, dx) * 180 / Math.PI;
        document.getElementById('compass-arrow').style.transform = `rotate(${angle}deg)`;
    }

    // --- 7. INICIALIZAÇÃO ---
    window.onload = () => {
        initMaps();
        
        document.getElementById('search-input').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            if (query.length > 2) {
                switchScreen('screen-select');
                const list = document.getElementById('destination-list');
                list.innerHTML = '';
                const filtered = campusData.filter(loc => loc.name.toLowerCase().includes(query));
                filtered.forEach(loc => {
                    const div = document.createElement('div');
                    div.className = 'list-item';
                    div.innerHTML = `<i class="fas fa-search"></i><div><h4>${loc.name}</h4><p>${loc.desc}</p></div>`;
                    div.onclick = () => selectDestination(loc);
                    list.appendChild(div);
                });
            }
        });
    };
</script>
</body>
</html>
